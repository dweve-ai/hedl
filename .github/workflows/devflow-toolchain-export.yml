name: Devflow toolchain export

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/devflow-toolchain-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustc +1.97.1 --version
          cargo +1.97.1 --version
          rustfmt +1.97.1 --version
          cargo +1.97.1 clippy --version

      - name: Prime offline Cargo cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/devflow-cache-primer/src
          cat >/tmp/devflow-cache-primer/Cargo.toml <<'TOML'
          [package]
          name = "devflow-cache-primer"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          blake3 = "1.8.5"
          clap = { version = "4.6.3", features = ["derive", "env", "wrap_help"] }
          libc = "0.2.177"
          regex = "1.13.1"
          rusqlite = { version = "0.40.1", features = ["bundled", "serde_json"] }
          serde = { version = "1.0.229", features = ["derive"] }
          serde_json = "1.0.151"
          signal-hook = "0.3.18"
          thiserror = "2.0.19"
          toml = "1.1.3"
          uuid = { version = "1.24.0", features = ["serde", "v7"] }
          walkdir = "2.5.0"

          [dev-dependencies]
          tempfile = "3.23.0"
          TOML
          printf 'fn main() {}\n' >/tmp/devflow-cache-primer/src/main.rs
          cargo +1.97.1 fetch --manifest-path /tmp/devflow-cache-primer/Cargo.toml
          cargo +1.97.1 generate-lockfile --manifest-path /tmp/devflow-cache-primer/Cargo.toml
          cp /tmp/devflow-cache-primer/Cargo.lock devflow-cache-primer.lock

      - name: Archive toolchain and Cargo cache
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc +1.97.1 --print sysroot)"
          printf '%s\n' "$sysroot" >rust-sysroot.txt
          tar -C "$(dirname "$sysroot")" -czf rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz "$(basename "$sysroot")"
          if [[ -d "$HOME/.cargo/git" ]]; then
            tar -C "$HOME" -czf cargo-home-cache.tar.gz .cargo/registry .cargo/git
          else
            tar -C "$HOME" -czf cargo-home-cache.tar.gz .cargo/registry
          fi
          sha256sum rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz cargo-home-cache.tar.gz devflow-cache-primer.lock >SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: devflow-rust-1.97.1-offline
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            rust-1.97.1-x86_64-unknown-linux-gnu.tar.gz
            cargo-home-cache.tar.gz
            devflow-cache-primer.lock
            rust-sysroot.txt
            SHA256SUMS
