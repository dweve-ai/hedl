name: Deploy Playground to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'playground/**'
      - 'crates/hedl-wasm/**'
      - 'crates/hedl-core/**'
      - 'crates/hedl-json/**'
      - 'crates/hedl-yaml/**'
      - 'crates/hedl-xml/**'
      - 'crates/hedl-csv/**'
      - 'crates/hedl-toon/**'
      - 'crates/hedl-c14n/**'
      - 'crates/hedl-lint/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-playground

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108

      - name: Build WASM package
        run: |
          cargo build --release --target wasm32-unknown-unknown \
            --package hedl-wasm --features json,yaml,xml,csv
          wasm-bindgen \
            --target web \
            --out-dir playground/pkg \
            --typescript \
            target/wasm32-unknown-unknown/release/hedl_wasm.wasm

      - name: Prepare playground directory
        run: |
          # Copy LICENSE file for compliance
          cp LICENSE playground/pkg/LICENSE 2>/dev/null || true

          # Remove unnecessary files
          rm -f playground/pkg/.gitignore
          rm -f playground/pkg/README.md
          rm -f playground/pkg/package.json

          # Create a simple CNAME file if needed (optional)
          # echo "hedl.dweve.com" > playground/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
