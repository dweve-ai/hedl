name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.2.1)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build hedl-cli
        run: cargo build --release --package hedl-cli --target ${{ matrix.target }}

      - name: Build hedl-mcp
        run: cargo build --release --package hedl-mcp --target ${{ matrix.target }}

      - name: Prepare artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/hedl-cli dist/hedl
          cp target/${{ matrix.target }}/release/hedl-mcp dist/hedl-mcp
          chmod +x dist/hedl dist/hedl-mcp
          cd dist
          tar -czvf hedl-${{ matrix.target }}.tar.gz hedl hedl-mcp
          mv hedl-${{ matrix.target }}.tar.gz ..

      - name: Prepare artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/hedl-cli.exe" "dist/hedl.exe"
          Copy-Item "target/${{ matrix.target }}/release/hedl-mcp.exe" "dist/hedl-mcp.exe"
          Compress-Archive -Path dist/* -DestinationPath "hedl-${{ matrix.target }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hedl-${{ matrix.target }}
          path: hedl-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum hedl-*.* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: HEDL ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/hedl-x86_64-unknown-linux-gnu.tar.gz
            artifacts/hedl-x86_64-apple-darwin.tar.gz
            artifacts/hedl-aarch64-apple-darwin.tar.gz
            artifacts/hedl-x86_64-pc-windows-msvc.zip
            artifacts/checksums.txt

  mcpb:
    name: Build MCPB Bundles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-gnu
            mcpb_os: linux
            mcpb_arch: amd64
            archive: tar.gz
            binary: hedl-mcp
          - rust_target: x86_64-apple-darwin
            mcpb_os: darwin
            mcpb_arch: amd64
            archive: tar.gz
            binary: hedl-mcp
          - rust_target: aarch64-apple-darwin
            mcpb_os: darwin
            mcpb_arch: arm64
            archive: tar.gz
            binary: hedl-mcp
          - rust_target: x86_64-pc-windows-msvc
            mcpb_os: win32
            mcpb_arch: amd64
            archive: zip
            binary: hedl-mcp.exe
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hedl-${{ matrix.rust_target }}
          path: artifact

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Create MCPB bundle
        run: |
          set -e
          MCPB_NAME="hedl-mcp-${{ matrix.mcpb_os }}-${{ matrix.mcpb_arch }}"
          mkdir -p "${MCPB_NAME}/server"

          # Extract binary from artifact
          cd artifact
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            echo "Extracting ZIP archive..."
            unzip -o "hedl-${{ matrix.rust_target }}.zip"
            ls -la
          else
            echo "Extracting TAR.GZ archive..."
            tar -xzf "hedl-${{ matrix.rust_target }}.tar.gz"
            ls -la
          fi
          cd ..

          # Copy binary to server directory
          echo "Copying binary: artifact/${{ matrix.binary }} to ${MCPB_NAME}/server/"
          if [ ! -f "artifact/${{ matrix.binary }}" ]; then
            echo "Error: Binary not found: artifact/${{ matrix.binary }}"
            ls -la artifact/
            exit 1
          fi
          cp "artifact/${{ matrix.binary }}" "${MCPB_NAME}/server/"
          chmod +x "${MCPB_NAME}/server/${{ matrix.binary }}" 2>/dev/null || true

          # Create manifest.json following MCPB 0.3 spec
          VERSION="${{ steps.version.outputs.version }}"
          BINARY="${{ matrix.binary }}"
          PLATFORM="${{ matrix.mcpb_os }}"

          cat > "${MCPB_NAME}/manifest.json" << MANIFEST_EOF
          {
            "\$schema": "https://static.modelcontextprotocol.io/schemas/2025-01-01/manifest.schema.json",
            "manifest_version": "0.3",
            "name": "hedl-mcp",
            "version": "${VERSION}",
            "title": "HEDL MCP Server",
            "description": "Model Context Protocol server for HEDL (Hierarchical Entity Data Language). Provides tools for parsing, validating, converting, optimizing, and querying HEDL documents with 93% better token efficiency than JSON.",
            "author": {
              "name": "Dweve B.V.",
              "url": "https://dweve.com"
            },
            "license": "Apache-2.0",
            "homepage": "https://github.com/dweve-ai/hedl",
            "repository": {
              "type": "git",
              "url": "https://github.com/dweve-ai/hedl"
            },
            "server": {
              "type": "binary"
            },
            "mcp_config": {
              "command": "server/${BINARY}",
              "args": [],
              "env": {}
            },
            "compatibility": {
              "platforms": ["${PLATFORM}"]
            },
            "tools": [
              {
                "name": "hedl_read",
                "description": "Read and parse a HEDL file, returning structured data"
              },
              {
                "name": "hedl_query",
                "description": "Query HEDL data using path expressions"
              },
              {
                "name": "hedl_validate",
                "description": "Validate HEDL syntax and structure"
              },
              {
                "name": "hedl_optimize",
                "description": "Optimize HEDL for minimal token usage"
              },
              {
                "name": "hedl_stats",
                "description": "Get statistics about HEDL document structure"
              },
              {
                "name": "hedl_format",
                "description": "Format HEDL with configurable style options"
              },
              {
                "name": "hedl_write",
                "description": "Write data to HEDL format"
              },
              {
                "name": "hedl_convert_to",
                "description": "Convert HEDL to JSON, YAML, XML, CSV, or Parquet"
              },
              {
                "name": "hedl_convert_from",
                "description": "Convert JSON, YAML, XML, or CSV to HEDL"
              },
              {
                "name": "hedl_stream",
                "description": "Stream large HEDL files efficiently"
              },
              {
                "name": "batch",
                "description": "Execute multiple HEDL operations in a single request"
              }
            ]
          }
          MANIFEST_EOF

          # Create .mcpb bundle (ZIP archive)
          cd "${MCPB_NAME}"
          zip -r "../${MCPB_NAME}.mcpb" manifest.json server/
          cd ..

          # Generate SHA256 checksum
          sha256sum "${MCPB_NAME}.mcpb" > "${MCPB_NAME}.mcpb.sha256"

      - name: Upload MCPB bundle
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-${{ matrix.mcpb_os }}-${{ matrix.mcpb_arch }}
          path: |
            hedl-mcp-${{ matrix.mcpb_os }}-${{ matrix.mcpb_arch }}.mcpb
            hedl-mcp-${{ matrix.mcpb_os }}-${{ matrix.mcpb_arch }}.mcpb.sha256

      - name: Add MCPB to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            hedl-mcp-${{ matrix.mcpb_os }}-${{ matrix.mcpb_arch }}.mcpb
            hedl-mcp-${{ matrix.mcpb_os }}-${{ matrix.mcpb_arch }}.mcpb.sha256
