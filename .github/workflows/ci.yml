name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (all features)
        run: cargo test --all-features --workspace
        env:
          NEO4J_PASSWORD: testpassword

      - name: Run doc tests
        run: cargo test --doc --workspace

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-features --workspace --lib -- -D warnings

  benchmarks:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmark tests
        run: cargo test --benches --workspace

  conformance:
    name: SPEC Conformance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run conformance tests
        run: cargo test --package hedl-core conformance --all-features

  miri:
    name: MIRI (Undefined Behavior Detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly with MIRI
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Setup MIRI
        run: cargo miri setup

      - name: Run MIRI on hedl-core
        run: |
          cd crates/hedl-core
          cargo +nightly miri test
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check

      - name: Run MIRI with stacked borrows
        run: |
          cd crates/hedl-core
          cargo +nightly miri test
        env:
          MIRIFLAGS: -Zmiri-tag-raw-pointers

      - name: Run MIRI with tree borrows (experimental)
        continue-on-error: true  # Tree borrows is experimental
        run: |
          cd crates/hedl-core
          cargo +nightly miri test
        env:
          MIRIFLAGS: -Zmiri-tree-borrows

  unsafe-audit:
    name: Unsafe Code Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to compare

      - name: Check for new unsafe code in hedl-core
        run: |
          # Compare with base branch to detect new unsafe
          git diff origin/master...HEAD -- 'crates/hedl-core/**/*.rs' > changes.diff

          if grep -q "^+.*unsafe" changes.diff; then
            echo "::error::New unsafe code detected in hedl-core"
            echo "New unsafe blocks found:"
            grep -n "^+.*unsafe" changes.diff
            echo ""
            echo "Please complete unsafe code audit:"
            echo "1. Fill out .plan/security/unsafe-audit-template.md"
            echo "2. Run MIRI validation"
            echo "3. Get security review"
            exit 1
          fi

          echo "✓ No new unsafe code detected in hedl-core"

      - name: Verify unsafe code inventory is updated
        if: failure()
        run: |
          # If unsafe was added, ensure inventory is updated
          if ! git diff origin/master...HEAD -- 'docs/unsafe-code-guidelines.md' | grep -q "^+.*|.*|.*|"; then
            echo "::error::Unsafe code inventory not updated"
            echo "Please update the table in docs/unsafe-code-guidelines.md"
            exit 1
          fi
