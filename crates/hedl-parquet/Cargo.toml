[package]
name = "hedl-parquet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

description = "HEDL to/from Apache Parquet conversion"
documentation = "https://docs.rs/hedl-parquet"
readme = "README.md"

publish = true

include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG*",
    "src/**",
    "tests/**",
    "benches/**",
    "examples/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[lints]
workspace = true

[dependencies]
hedl-core = { workspace = true }
thiserror = { workspace = true }
parquet = { workspace = true }
arrow = { workspace = true }
bytes = "1.11"

tokio = { version = "1.35", features = ["fs", "io-util", "rt"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
hedl-test = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
tempfile = "3.13"
tokio = { version = "1.35", features = ["full", "test-util"] }
futures = "0.3"

[features]
default = []
async-io = ["tokio", "futures"]

[[bench]]
name = "projection_benchmarks"
harness = false
