[package]
name = "hedl-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

description = "HEDL C ABI bindings"
documentation = "https://docs.rs/hedl-ffi"
readme = "README.md"

publish = true

include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG*",
    "src/**",
    "tests/**",
    "benches/**",
    "examples/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

# FFI crate requires unsafe code by nature
[lints.rust]
warnings = "warn"
rust_2018_idioms = "warn"
unsafe_code = "allow"

[lints.clippy]
all = "warn"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
hedl-core = { workspace = true }
hedl-c14n = { workspace = true }
hedl-lint = { workspace = true }
tracing = { workspace = true }
num_cpus = { workspace = true }

hedl-json = { workspace = true, optional = true }
hedl-yaml = { workspace = true, optional = true }
hedl-xml = { workspace = true, optional = true }
hedl-csv = { workspace = true, optional = true }
hedl-parquet = { workspace = true, optional = true }
hedl-neo4j = { workspace = true, optional = true }
hedl-toon = { workspace = true, optional = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["all-formats"]
all-formats = ["json", "yaml", "xml", "csv", "parquet", "neo4j", "toon"]
json = ["dep:hedl-json"]
yaml = ["dep:hedl-yaml"]
xml = ["dep:hedl-xml"]
csv = ["dep:hedl-csv"]
parquet = ["dep:hedl-parquet"]
neo4j = ["dep:hedl-neo4j"]
toon = ["dep:hedl-toon"]
minimal = []
web-formats = ["json", "yaml", "xml"]
data-formats = ["json", "csv", "parquet"]
async-ffi = []
