[package]
name = "hedl-json-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.hedl-json]
path = ".."

[dependencies.hedl-core]
path = "../../hedl-core"

# Prevent this from interfering with workspace
[workspace]
members = ["."]

[[bin]]
name = "fuzz_json_to_hedl"
path = "fuzz_targets/fuzz_json_to_hedl.rs"
test = false
doc = false

[[bin]]
name = "fuzz_jsonpath"
path = "fuzz_targets/fuzz_jsonpath.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hedl_to_json"
path = "fuzz_targets/fuzz_hedl_to_json.rs"
test = false
doc = false
