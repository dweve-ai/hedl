[package]
name = "hedl-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

description = "Model Context Protocol (MCP) server for HEDL - AI/LLM integration"
documentation = "https://docs.rs/hedl-mcp"
readme = "README.md"

publish = true

include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG*",
    "src/**",
    "tests/**",
    "benches/**",
    "examples/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[lints]
workspace = true

[[bin]]
name = "hedl-mcp"
path = "src/main.rs"

[dependencies]
hedl-core = { workspace = true }
hedl-json = { workspace = true }
hedl-c14n = { workspace = true }
hedl-lint = { workspace = true }
hedl-yaml = { workspace = true }
hedl-xml = { workspace = true }
hedl-csv = { workspace = true }
hedl-parquet = { workspace = true }
hedl-neo4j = { workspace = true }
hedl-stream = { workspace = true }
hedl-toon = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
base64 = { workspace = true }
csv = { workspace = true }
dashmap = { workspace = true }
rayon = { workspace = true }
ring = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
mockall = { workspace = true }
proptest = { workspace = true }

[features]
default = []
