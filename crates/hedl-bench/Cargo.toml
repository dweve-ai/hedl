[package]
name = "hedl-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

description = "Benchmarks and performance testing for HEDL"
readme = "README.md"

publish = false

include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "src/**",
    "tests/**",
    "benches/**",
]

[lints]
workspace = true

[dependencies]
hedl-core = { workspace = true }
hedl-stream = { workspace = true }
hedl-c14n = { workspace = true }
hedl-lint = { workspace = true }
hedl-lsp = { workspace = true }
hedl-mcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
fake = { workspace = true }
tiktoken-rs = { workspace = true }
ureq = { workspace = true }
once_cell = { workspace = true }
tempfile = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
ctor = { workspace = true }
csv = { workspace = true }
flate2 = { workspace = true }

hedl-cli = { workspace = true, optional = true }
hedl-json = { workspace = true, optional = true }
hedl-yaml = { workspace = true, optional = true }
hedl-xml = { workspace = true, optional = true }
hedl-toon = { workspace = true, optional = true }
hedl-csv = { workspace = true, optional = true }
hedl-neo4j = { workspace = true, optional = true }
hedl-parquet = { workspace = true, optional = true }
hedl-ffi = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
polars = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
dhat = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tower-lsp = { workspace = true }
proptest = { workspace = true }
serial_test = { workspace = true }

[features]
default = ["json", "yaml", "xml", "csv", "toon", "neo4j", "parquet", "ffi", "wasm-runtime", "cli"]
dhat-heap = ["dhat"]
json = ["dep:hedl-json"]
yaml = ["dep:hedl-yaml"]
xml = ["dep:hedl-xml"]
csv = ["dep:hedl-csv"]
toon = ["dep:hedl-toon"]
neo4j = ["dep:hedl-neo4j"]
parquet = ["dep:hedl-parquet", "dep:parquet"]
ffi = ["dep:hedl-ffi"]
wasm-runtime = ["dep:wasmtime", "dep:anyhow"]
cli = ["dep:hedl-cli"]
database-comparison = ["dep:rusqlite", "dep:duckdb", "dep:polars", "dep:arrow"]

[[bin]]
name = "accuracy"
path = "src/bin/accuracy.rs"

[[example]]
name = "simple_benchmark"
path = "examples/simple_benchmark.rs"

[[example]]
name = "custom_report"
path = "examples/custom_report.rs"

[[example]]
name = "regression_check"
path = "examples/regression_check.rs"

[[bench]]
name = "parsing"
harness = false
path = "benches/core/parsing.rs"

[[bench]]
name = "lexer"
harness = false
path = "benches/core/lexer.rs"

[[bench]]
name = "validation"
harness = false
path = "benches/core/validation.rs"

[[bench]]
name = "end_to_end_workflow"
path = "benches/integration/end_to_end.rs"
harness = false

[[bench]]
name = "parallel"
path = "benches/integration/parallel.rs"
harness = false

[[bench]]
name = "end_to_end"
path = "benches/integration/end_to_end.rs"
harness = false

[[bench]]
name = "regression"
path = "benches/regression/tracking.rs"
harness = false

[[bench]]
name = "canonicalization"
path = "benches/features/canonicalization.rs"
harness = false

[[bench]]
name = "streaming"
path = "benches/features/streaming.rs"
harness = false

[[bench]]
name = "tensors"
path = "benches/features/tensors.rs"
harness = false

[[bench]]
name = "rows"
path = "benches/features/rows.rs"
harness = false

[[bench]]
name = "references"
path = "benches/features/references.rs"
harness = false

[[bench]]
name = "nesting"
path = "benches/features/nesting.rs"
harness = false

[[bench]]
name = "zero_copy"
path = "benches/features/zero_copy.rs"
harness = false

[[bench]]
name = "ffi"
harness = false
path = "benches/bindings/ffi.rs"

[[bench]]
name = "wasm"
harness = false
path = "benches/bindings/wasm.rs"

[[bench]]
name = "lsp"
harness = false
path = "benches/tools/lsp.rs"

[[bench]]
name = "mcp"
harness = false
path = "benches/tools/mcp.rs"

[[bench]]
name = "linting"
harness = false
path = "benches/tools/linting.rs"

[[bench]]
name = "format_json"
harness = false
path = "benches/formats/json.rs"

[[bench]]
name = "format_yaml"
harness = false
path = "benches/formats/yaml.rs"

[[bench]]
name = "format_xml"
harness = false
path = "benches/formats/xml.rs"

[[bench]]
name = "format_csv"
harness = false
path = "benches/formats/csv.rs"

[[bench]]
name = "format_parquet"
harness = false
path = "benches/formats/parquet.rs"

[[bench]]
name = "format_neo4j"
harness = false
path = "benches/formats/neo4j_cypher.rs"

[[bench]]
name = "format_toon"
harness = false
path = "benches/formats/toon.rs"

[[bench]]
name = "format_roundtrip"
harness = false
path = "benches/formats/roundtrip.rs"

[[bench]]
name = "batch_operations"
harness = false
path = "benches/cli/batch_operations.rs"
required-features = ["cli"]
