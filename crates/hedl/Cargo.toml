[package]
name = "hedl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

description = "HEDL - Hierarchical Entity Data Language"
documentation = "https://docs.rs/hedl"
readme = "README.md"

publish = true

include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG*",
    "src/**",
    "tests/**",
    "benches/**",
    "examples/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[lints]
workspace = true

[dependencies]
hedl-core = { workspace = true }
hedl-c14n = { workspace = true }
hedl-json = { workspace = true }
hedl-lint = { workspace = true }
thiserror = { workspace = true }

serde = { workspace = true, optional = true }
hedl-yaml = { workspace = true, optional = true }
hedl-xml = { workspace = true, optional = true }
hedl-csv = { workspace = true, optional = true }
hedl-parquet = { workspace = true, optional = true }
hedl-neo4j = { workspace = true, optional = true }
hedl-toon = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }

[features]
default = []
serde = ["dep:serde", "hedl-core/serde"]
yaml = ["dep:hedl-yaml"]
xml = ["dep:hedl-xml"]
csv = ["dep:hedl-csv"]
parquet = ["dep:hedl-parquet"]
neo4j = ["dep:hedl-neo4j"]
toon = ["dep:hedl-toon"]
all-formats = ["yaml", "xml", "csv", "parquet", "neo4j", "toon"]
