# Known transitive dependency warnings
# These are "unmaintained" (not vulnerable) or unfixable without upgrading major dependencies

[advisories]
ignore = [
    "RUSTSEC-2024-0436",  # paste - used by parquet, PR to fix was closed upstream
    "RUSTSEC-2025-0134",  # rustls-pemfile - used by neo4rs, awaiting upstream update
    "RUSTSEC-2025-0003",  # fast-float segfault - polars 0.44.2 transitive dep, no fix available
    "RUSTSEC-2024-0379",  # fast-float soundness - polars 0.44.2 transitive dep, no fix available
    "RUSTSEC-2025-0020",  # pyo3 buffer overflow - polars 0.44.2 transitive dep, requires polars upgrade
]
